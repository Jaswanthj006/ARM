<!doctype html><html><head><meta charset="utf-8"><title>Screen test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}img{width:100vw;height:100vh;object-fit:contain;display:block}
#n{position:fixed;left:8px;bottom:6px;color:#444;font:12px system-ui}</style></head>
<body><img id="i" alt=""><div id="n">Screen-to-camera test · waiting</div>
<script>
// Shows whatever image the test runner puts in screen/current.json (camera-in-the-loop test).
let cur = '';
setInterval(async () => {
  try {
    const r = await fetch('screen/current.json?' + Date.now()); const j = await r.json();
    if (j.img !== cur) { cur = j.img; document.getElementById('i').src = 'screen/' + j.img + '?' + Date.now(); document.getElementById('n').textContent = j.label || ''; }
  } catch {}
}, 250);
</script></body></html>
